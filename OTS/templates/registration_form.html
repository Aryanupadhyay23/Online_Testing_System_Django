{% extends 'main.html' %}

{% block title %} OTS-Registration Form {% endblock %}

{% block top %}
    <a href="{% url 'OTS:login' %}">Login</a>
{% endblock %}

{% block content %}
<div class="all-forms">
    <form action="{% url 'OTS:storeCandidate' %}" method="post">
        {% csrf_token %}
        <!-- Add registration form fields here -->
        <label for="username">Username:</label>
        <input type="text" name="username"><br><br>
        <label for="password">Password:</label>
        <input type="password" name="password"><br><br>
        <label for="name">Name:</label>
        <input type="text" name="name"><br><br>


        <input type="submit" value="Submit">
        <input type="reset" value="Clear">
    </form>
    Already have an account? <a href="{% url 'OTS:login' %}">Login here</a>
</div>
{% endblock %}
